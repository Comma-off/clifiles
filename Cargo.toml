[package]
name = "clifiles"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["events"] }
ratatui-image = { version = "4", features = ["crossterm"] }
image = "0.25"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
directories = "5"
zip = "2"
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.23"
unicode-width = "0.2"
chrono = "0.4"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }

[profile.release]
opt-level = 3
lto = true
